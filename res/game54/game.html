<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
	<title>NYT GAME</title>
	<link rel="icon" type="image/png" href="/favicon.png" />
	<style>
	body, html {
        margin: 0;
        height: 100%; 
        overflow: hidden; *//* 隐藏滚动条 */
    }
		
		
    .landscape-screen{
	    transform-origin: top left;
	    transform: rotate(90deg) translateY(-100%)
    }
	</style>
  </head>
  <body>

<iframe id="Frame"  class="landscape-screen"  src="web-mobile/index.html" style="border-width:0px;"></iframe>
<script>

    var orientation = window.orientation;
			
	//开始时调用
	var Frame = document.getElementById("Frame");
	if(orientation == 180 || orientation == 0 || orientation == -180){
		//注意竖屏时要把 iframe的宽设置为当前窗口的高度 高设置为当前窗口的宽度
		Frame.height = window.innerWidth;
		Frame.width = window.innerHeight;
				
		//通过css样式旋转90度
		Frame.classList.add("landscape-screen");
	}else{
		//横屏时则正常
		Frame.height = window.innerHeight;
		Frame.width = window.innerWidth;
				
		//通过移除类去掉css样式
		Frame.classList.remove("landscape-screen");
	}
			
	//监听手机旋转事件 根据旋转状态设置旋转的css样式
	window.onorientationchange = function () {
        if(orientation == 180 || orientation == 0 || orientation == -180){
			Frame.classList.add("landscape-screen");
		}else{
			Frame.classList.remove("landscape-screen");
		}
     };
</script>
  </body>
</html>
